<nav>

    <div class="nav-container">

        <h2>Todo App 🚀</h2>

        <button id="theme-toggle">
            🌙
        </button>

        <div>

            {% if request.user.is_authenticated %}

                <span>
                    Hello, {{ request.user.username }}
                </span>

                <a href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>
