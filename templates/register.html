{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h1>Register</h1>

    <form method="POST" class="task-form">

        {% csrf_token %}

        {{ form }}

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>

{% endblock %}
