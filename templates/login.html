{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h1>Login</h1>

    <form method="POST" class="task-form">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have account?

        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</div>

{% endblock %}
